name: quarkmed

# Production overlay for an Alibaba Cloud ECS host.
# PostgreSQL is external (Alibaba Cloud RDS), while the private queue and
# Chromium rendering service stay inside the Compose network.
services:
  queue:
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  tools:
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8012/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  api:
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/api/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  worker:
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  web:
    ports:
      - "${WEB_BIND_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

