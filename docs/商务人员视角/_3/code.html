<!-- Interactive Sync Script -->
<script data-purpose="form-preview-sync">
    // Bind inputs to preview card elements for real-time reactivity
    const inputType = document.getElementById('input-project-type');
    const inputName = document.getElementById('input-project-name');
    const inputCode = document.getElementById('input-project-code');
    const inputStart = document.getElementById('input-start-date');
    const inputEnd = document.getElementById('input-end-date');
    const inputLeader = document.getElementById('input-project-leader');
    const inputDesc = document.getElementById('input-project-desc');
    const charCount = document.getElementById('char-count');

    const previewBadge = document.getElementById('preview-badge');
    const previewName = document.getElementById('preview-name');
    const previewTitle = document.getElementById('preview-title');
    const previewCode = document.getElementById('preview-code');
    const previewStart = document.getElementById('preview-start');
    const previewEnd = document.getElementById('preview-end');
    const previewLeader = document.getElementById('preview-leader');
    const previewDesc = document.getElementById('preview-desc');

    if (inputType) {
      inputType.addEventListener('change', (e) => {
        const val = e.target.value;
        previewBadge.textContent = val || '请选择';
      });
    }

    if (inputName) {
      inputName.addEventListener('input', (e) => {
        const val = e.target.value.trim();
        previewName.textContent = val || '-';
        previewTitle.textContent = val || 'PPT项目';
      });
    }

    if (inputCode) {
      inputCode.addEventListener('input', (e) => {
        previewCode.textContent = e.target.value.trim() || '-';
      });
    }

    if (inputStart) {
      inputStart.addEventListener('change', (e) => {
        previewStart.textContent = e.target.value || '-';
      });
    }

    if (inputEnd) {
      inputEnd.addEventListener('change', (e) => {
        previewEnd.textContent = e.target.value || '-';
      });
    }

    if (inputLeader) {
      inputLeader.addEventListener('input', (e) => {
        previewLeader.textContent = e.target.value.trim() || '-';
      });
    }

    if (inputDesc) {
      inputDesc.addEventListener('input', (e) => {
        const val = e.target.value;
        charCount.textContent = `${val.length}/500`;
        previewDesc.textContent = val.trim() || '-';
      });
    }
  </script>
